name: Submit changed pages to IndexNow

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'sitemap.xml'

permissions:
  contents: read

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Submit sitemap URLs to IndexNow
        shell: bash
        run: |
          KEY="bd8ff5e7446843a683af9b077874c63e"
          HOST="firestoppingmanchesteruk.co.uk"
          BASE="https://$HOST"
          URLS=$(grep -oP '(?<=<loc>).*?(?=</loc>)' sitemap.xml | sed 's/.*/"&"/' | paste -sd, -)
          PAYLOAD="{\"host\":\"$HOST\",\"key\":\"$KEY\",\"keyLocation\":\"$BASE/$KEY.txt\",\"urlList\":[$URLS]}"
          curl --fail-with-body -sS -X POST "https://api.indexnow.org/IndexNow" -H "Content-Type: application/json; charset=utf-8" --data "$PAYLOAD"
