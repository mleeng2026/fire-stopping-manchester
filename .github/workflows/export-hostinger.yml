name: Export Hostinger Site
on:
  push:
    branches: [main]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Git-only files
        run: |
          rm -rf .git .github _drafts
      - name: Package site
        uses: actions/upload-artifact@v4
        with:
          name: fire-stopping-manchester-hostinger
          path: .
          include-hidden-files: true
          retention-days: 7
